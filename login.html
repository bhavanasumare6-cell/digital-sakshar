<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Sakshar - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4facfe, #00c6ff);
    }
    .login-box {
      width: min(90%, 390px);
      background: white;
      border-radius: 16px;
      padding: 35px 30px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #075985;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
    }
    h1 {
      color: #075985;
      margin-bottom: 6px;
      font-size: 2rem;
    }
    .subtitle {
      color: #4b5563;
      margin-bottom: 24px;
    }
    .field {
      text-align: left;
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #075985;
      box-shadow: 0 0 0 2px rgba(7, 89, 133, 0.12);
    }
    .forgot {
      display: block;
      text-align: left;
      margin: 10px 0 18px;
      color: #075985;
      font-size: 0.95rem;
    }
    .login-btn {
      width: 100%;
      background: #075985;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .login-btn:hover { background: #06496a; }
    .signup {
      margin-top: 20px;
      color: #4b5563;
      font-size: 0.95rem;
    }
    .signup a {
      color: #075985;
      font-weight: bold;
    }
    .home {
      display: inline-block;
      margin-top: 18px;
      color: #075985;
      font-weight: bold;
    }
    .footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">DS</div>
    <h1>Digital Sakshar</h1>
    <p class="subtitle">Digital Literacy Learning Platform</p>

    <form>
      <div class="field">
        <label for="email">Email / Username</label>
        <input type="text" id="email" placeholder="Enter your email or username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <a href="#" class="forgot">Forgot Password?</a>
      <button class="login-btn" type="submit">Login</button>
    </form>

    <div class="signup">
      Don't have an account? <a href="#">Register Now</a>
    </div>

    <a href="index.html" class="home">← Back to Home</a>

    <div class="footer">© 2026 Digital Sakshar | Learn • Explore • Grow</div>
  </div>
</body>
</html>
